[workspace]
resolver = "2"
members = [
  "crates/herdr-client",
  "crates/hsm-core",
  "crates/hsm-tui",
  "crates/hsm",
  "crates/agentmail-core",
  "crates/agentmail-delivery",
  "crates/agentmail-mcp",
  "crates/agentmail",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "fs", "signal"] }
tokio-util = "0.7"
futures = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30"
crossterm = "0.29"
interprocess = { version = "2", features = ["tokio"] }
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
sysinfo = "0.39"
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
